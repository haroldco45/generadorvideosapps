<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibras Positivas | Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

    <nav class="p-6 bg-slate-800 border-b border-slate-700 shadow-lg text-center">
        <h1 class="text-2xl font-bold italic text-indigo-400">Vibras Positivas <span class="text-slate-500 font-light text-sm italic">| Video App</span></h1>
    </nav>

    <main class="container mx-auto px-6 py-12 text-center max-w-2xl">
        <h2 class="text-3xl font-extrabold mb-4">Generador de Videos para Apps</h2>
        <p class="text-slate-400 mb-8 italic">Ideal para capturar tus apps como "Criollitas" en 15 segundos.</p>

        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
            <div class="space-y-5">
                <div>
                    <label class="block text-left text-xs font-bold text-indigo-400 uppercase mb-1 ml-1">URL de la App</label>
                    <input type="url" id="url-input" value="https://haroldco45.github.io/criollitas/" 
                           class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl focus:border-indigo-500 outline-none text-sm">
                </div>

                <div>
                    <label class="block text-left text-xs font-bold text-indigo-400 uppercase mb-1 ml-1">API Key (Sandbox)</label>
                    <input type="password" id="api-key" placeholder="Pega tu Sandbox Key de Shotstack" 
                           class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl focus:border-indigo-500 outline-none text-sm text-center tracking-widest">
                </div>
                
                <button onclick="requestVideo()" id="btn-main"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-xl font-bold text-lg shadow-lg transition-all active:scale-95">
                    <i class="fas fa-video mr-2"></i> GENERAR VIDEO REAL
                </button>
            </div>
        </div>

        <div id="loader" class="hidden mt-12">
            <div class="flex flex-col items-center">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-16 w-16 mb-4"></div>
                <p id="status-msg" class="text-indigo-400 font-medium animate-pulse italic">Iniciando en el servidor...</p>
            </div>
        </div>

        <div id="result" class="hidden mt-12 bg-slate-800 p-6 rounded-3xl border border-green-500/30">
            <h3 class="text-green-400 font-bold mb-4 italic uppercase tracking-widest">¡Video Terminado!</h3>
            <video id="final-video" controls class="w-full rounded-xl shadow-2xl mb-6 bg-black aspect-video"></video>
            <a id="download-btn" href="#" download="vibras_positivas.mp4" 
               class="block w-full bg-green-600 hover:bg-green-500 text-white py-4 rounded-xl font-bold shadow-lg text-center">
                <i class="fas fa-download mr-2"></i> DESCARGAR MP4
            </a>
        </div>
    </main>

    <script>
        async function requestVideo() {
            const urlInput = document.getElementById('url-input').value;
            const apiKey = document.getElementById('api-key').value.trim();
            const btn = document.getElementById('btn-main');
            const loader = document.getElementById('loader');

            if(!apiKey) return alert("Por favor, pega tu llave Sandbox.");

            btn.disabled = true;
            btn.classList.add('opacity-50');
            loader.classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');

            try {
                const response = await fetch('https://api.shotstack.io/v1/render', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                    body: JSON.stringify({
                        timeline: {
                            tracks: [{
                                clips: [{
                                    asset: {
                                        type: 'html',
                                        html: `<iframe src="${urlInput}" width="1024" height="576" style="border:none;"></iframe>`,
                                        width: 1024, height: 576
                                    },
                                    start: 0, length: 15
                                }]
                            }]
                        },
                        output: { format: 'mp4', resolution: 'sd' }
                    })
                });

                const data = await response.json();
                
                if (data && data.success && data.response.id) {
                    checkStatus(data.response.id, apiKey);
                } else {
                    const errorMsg = (data.response && data.response.message) ? data.response.message : "Fallo en la comunicación con Shotstack";
                    throw new Error(errorMsg);
                }

            } catch (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loader.classList.add('hidden');
            }
        }

        async function checkStatus(id, key) {
            const statusMsg = document.getElementById('status-msg');
            try {
                const res = await fetch(`https://api.shotstack.io/v1/render/${id}`, {
                    headers: { 'x-api-key': key }
                });
                const data = await res.json();
                const status = data.response.status;

                statusMsg.innerText = `PROCESANDO: ${status.toUpperCase()}...`;

                if (status === 'done') {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('final-video').src = data.response.url;
                    document.getElementById('download-btn').href = data.response.url;
                    document.getElementById('btn-main').disabled = false;
                    document.getElementById('btn-main').classList.remove('opacity-50');
                } else if (status === 'failed') {
                    throw new Error("El renderizado falló.");
                } else {
                    setTimeout(() => checkStatus(id, key), 3000);
                }
            } catch (e) {
                alert("Error consultando estado: " + e.message);
                location.reload();
            }
        }
    </script>
</body>
</html>
