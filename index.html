<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vibras Positivas | Video Generator Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans">

    <main class="container mx-auto px-6 py-12 max-w-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold italic text-indigo-400">Vibras Positivas</h1>
            <p class="text-gray-400">Grabador de Apps en Tiempo Real</p>
        </div>

        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
            <label class="block mb-2 text-sm font-medium">URL de la App a grabar:</label>
            <input type="url" id="url-input" value="https://haroldco45.github.io/criollitas/" 
                   class="w-full p-4 rounded-xl bg-slate-900 border border-slate-600 mb-6 outline-none focus:border-indigo-500">
            
            <input type="password" id="api-key" placeholder="Pega aquí tu API KEY de Shotstack" 
                   class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 mb-6 text-sm">

            <button onclick="requestVideo()" id="btn-main"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 p-4 rounded-xl font-bold transition duration-300">
                <i class="fas fa-magic mr-2"></i> CREAR VIDEO DE 30s REAL
            </button>
        </div>

        <div id="loader" class="hidden mt-10 text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-indigo-500 mb-4"></div>
            <p id="status-msg">Enviando URL al servidor de grabación...</p>
        </div>

        <div id="result" class="hidden mt-10 bg-slate-800 p-6 rounded-3xl border border-green-500/30">
            <h2 class="text-green-400 font-bold mb-4 italic">¡VIDEO GENERADO CON ÉXITO!</h2>
            <video id="final-video" controls class="w-full rounded-xl shadow-2xl mb-6"></video>
            <a id="download-btn" href="#" download class="block text-center bg-green-600 p-4 rounded-xl font-bold">
                📥 DESCARGAR MP4 AHORA
            </a>
        </div>
    </main>

    <script>
        async function requestVideo() {
            const urlToRecord = document.getElementById('url-input').value;
            const apiKey = document.getElementById('api-key').value;
            
            if(!apiKey) return alert("Necesitas una API KEY de Shotstack para que funcione");

            document.getElementById('btn-main').disabled = true;
            document.getElementById('loader').classList.remove('hidden');

            // 1. Configuramos la petición para grabar la pantalla de la URL
            const response = await fetch('https://api.shotstack.io/v1/render', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey
                },
                body: JSON.stringify({
                    timeline: {
                        tracks: [{
                            clips: [{
                                asset: {
                                    type: 'html',
                                    html: `<iframe src="${urlToRecord}" width="1024" height="576" style="border:none;"></iframe>`,
                                    css: "body { margin: 0; overflow: hidden; }",
                                    width: 1024,
                                    height: 576
                                },
                                start: 0,
                                length: 30
                            }]
                        }]
                    },
                    output: { format: 'mp4', resolution: 'hd' }
                })
            });

            const data = await response.json();
            const renderId = data.response.id;
            checkStatus(renderId, apiKey);
        }

        async function checkStatus(id, key) {
            const res = await fetch(`https://api.shotstack.io/v1/render/${id}`, {
                headers: { 'x-api-key': key }
            });
            const data = await res.json();
            
            if(data.response.status === 'done') {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('final-video').src = data.response.url;
                document.getElementById('download-btn').href = data.response.url;
            } else {
                document.getElementById('status-msg').innerText = "Procesando video... (" + data.response.status + ")";
                setTimeout(() => checkStatus(id, key), 3000);
            }
        }
    </script>
</body>
</html>
