<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibras Positivas | Video Studio v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#0f172a] text-white font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-[#1e293b] p-8 rounded-[2rem] shadow-2xl border border-slate-700 text-center">
        <h1 class="text-2xl font-black text-indigo-400 mb-6 italic tracking-tighter uppercase">Vibras Positivas</h1>
        
        <div class="space-y-4">
            <div class="text-left">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2 mb-1 block">URL de la App (con https://)</label>
                <input type="url" id="url-input" value="https://haroldco45.github.io/criollitas/" 
                       class="w-full p-4 bg-[#0f172a] border border-slate-700 rounded-2xl outline-none text-sm focus:border-indigo-500 transition-all">
            </div>
            
            <div class="text-left">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2 mb-1 block">API Key de Shotstack (Sandbox)</label>
                <input type="password" id="api-key" placeholder="Pega tu Sandbox Key aquí" 
                       class="w-full p-4 bg-[#0f172a] border border-slate-700 rounded-2xl outline-none text-sm text-center tracking-widest">
            </div>
            
            <button onclick="requestVideo()" id="btn-main"
                    class="w-full bg-indigo-600 py-4 rounded-2xl font-black hover:bg-indigo-500 transition-all shadow-lg uppercase tracking-widest active:scale-95">
                GENERAR VIDEO REAL
            </button>
        </div>

        <div id="loader" class="hidden mt-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-800 h-12 w-12 mx-auto mb-4"></div>
            <p id="status-msg" class="text-indigo-400 text-xs animate-pulse font-bold tracking-widest">CONECTANDO...</p>
        </div>

        <div id="result" class="hidden mt-8 p-6 bg-[#0f172a] rounded-[2rem] border border-green-500/20 shadow-inner">
            <h3 class="text-green-400 font-bold mb-4 uppercase text-[10px] tracking-[0.2em]">¡Procesamiento Exitoso!</h3>
            <video id="final-video" controls class="w-full rounded-2xl mb-6 shadow-2xl border border-slate-800"></video>
            <a id="download-btn" href="#" download="vibras_positivas.mp4" 
               class="block text-center bg-green-600 py-4 rounded-2xl font-bold text-sm hover:bg-green-500 transition-all shadow-lg uppercase">
                📥 Guardar Video
            </a>
        </div>
    </div>

    <script>
        async function requestVideo() {
            const urlInput = document.getElementById('url-input').value.trim();
            const apiKey = document.getElementById('api-key').value.trim();
            const btn = document.getElementById('btn-main');
            const loader = document.getElementById('loader');

            if(!apiKey) return alert("Pega la API KEY de Sandbox.");
            if(!urlInput.startsWith('http')) return alert("La URL debe empezar con http:// o https://");

            btn.disabled = true;
            btn.style.opacity = "0.5";
            loader.classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');

            const payload = {
                timeline: {
                    tracks: [{
                        clips: [{
                            asset: {
                                type: 'html',
                                html: `<iframe src="${urlInput}" width="1024" height="576" style="border:none;"></iframe>`,
                                width: 1024, height: 576
                            },
                            start: 0, length: 15
                        }]
                    }]
                },
                output: { format: 'mp4', resolution: 'sd' }
            };

            try {
                const response = await fetch('https://api.shotstack.io/v1/render', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.response && data.response.id) {
                    document.getElementById('status-msg').innerText = "GRABANDO CONTENIDO...";
                    checkStatus(data.response.id, apiKey);
                } else {
                    const errorMsg = data.response ? data.response.message : "Error desconocido";
                    throw new Error(errorMsg);
                }
            } catch (error) {
                alert("DETALLE: " + error.message);
                btn.disabled = false;
                btn.style.opacity = "1";
                loader.classList.add('hidden');
            }
        }

        async function checkStatus(id, key) {
            try {
                const res = await fetch(`https://api.shotstack.io/v1/render/${id}`, {
                    headers: { 'x-api-key': key }
                });
                const data = await res.json();
                const status = data.response ? data.response.status : null;

                if (status) document.getElementById('status-msg').innerText = "ESTADO: " + status.toUpperCase();

                if (status === 'done') {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('final-video').src = data.response.url;
                    document.getElementById('download-btn').href = data.response.url;
                    document.getElementById('btn-main').disabled = false;
                    document.getElementById('btn-main').style.opacity = "1";
                } else if (status === 'failed') {
                    alert("El servidor no pudo renderizar el video. Revisa tu URL.");
                    location.reload();
                } else {
                    setTimeout(() => checkStatus(id, key), 4000);
                }
            } catch (e) {
                setTimeout(() => checkStatus(id, key), 4000);
            }
        }
    </script>
</body>
</html>
