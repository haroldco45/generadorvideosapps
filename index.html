<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibras Positivas | Fix Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 p-8 rounded-[2rem] border border-slate-800 text-center shadow-2xl">
        <h1 class="text-xl font-black text-indigo-500 mb-8 uppercase italic">Vibras Positivas Studio</h1>
        
        <div class="space-y-6">
            <input type="url" id="url-input" value="https://haroldco45.github.io/criollitas/" 
                   class="w-full p-4 bg-black border border-slate-700 rounded-2xl outline-none text-sm text-center focus:border-indigo-500 transition-all">
            
            <p class="text-[10px] text-slate-500 uppercase font-bold">API KEY CARGADA: ...Pp1TA</p>

            <button onclick="requestVideo()" id="btn-main"
                    class="w-full bg-indigo-600 py-5 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-indigo-500 active:scale-95 transition-all shadow-lg">
                GENERAR VIDEO AHORA
            </button>
        </div>

        <div id="loader" class="hidden mt-10">
            <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p id="status-msg" class="text-indigo-400 text-[10px] font-bold animate-pulse uppercase">PROCESANDO...</p>
        </div>

        <div id="result" class="hidden mt-10 p-4 bg-black rounded-3xl border border-green-500/30">
            <video id="final-video" controls class="w-full rounded-2xl mb-4 bg-slate-800 aspect-[9/16] shadow-2xl"></video>
            <a id="download-btn" href="#" download class="block text-center bg-green-600 py-4 rounded-xl font-bold text-xs uppercase">📥 GUARDAR MP4</a>
        </div>
    </div>

    <script>
        // TU LLAVE FIJA PARA EVITAR ERRORES DE PEGADO
        const MY_KEY = "CA9aKlz40Ca3D8thAwzEh7jS6znYkUOOFVJPp1TA";

        async function requestVideo() {
            const url = document.getElementById('url-input').value.trim();
            const btn = document.getElementById('btn-main');
            const loader = document.getElementById('loader');

            btn.style.display = 'none';
            loader.classList.remove('hidden');

            try {
                const response = await fetch('https://api.shotstack.io/v1/render', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': MY_KEY },
                    body: JSON.stringify({
                        timeline: {
                            tracks: [{
                                clips: [{
                                    asset: { 
                                        type: 'html', 
                                        html: `<iframe src="${url}" width="1024" height="1820" style="border:none;"></iframe>`,
                                        width: 1024, height: 1820
                                    },
                                    start: 0, length: 10
                                }]
                            }]
                        },
                        output: { format: 'mp4', resolution: 'sd', aspectRatio: '9:16' }
                    })
                });

                const data = await response.json();
                
                // VALIDACIÓN RADICAL: Si no hay ID, no intentamos leer nada más
                if (data && data.response && data.response.id) {
                    checkStatus(data.response.id);
                } else {
                    alert("El servidor rechazó la orden. Revisa si tu API Key sigue activa en el panel.");
                    location.reload();
                }

            } catch (e) {
                alert("Error de conexión. Intenta de nuevo.");
                location.reload();
            }
        }

        async function checkStatus(id) {
            try {
                const res = await fetch('https://api.shotstack.io/v1/render/' + id, { 
                    headers: { 'x-api-key': MY_KEY } 
                });
                const data = await res.json();
                
                if (!data || !data.response) return setTimeout(() => checkStatus(id), 4000);

                const status = data.response.status;
                document.getElementById('status-msg').innerText = status.toUpperCase() + "...";

                if (status === 'done') {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('final-video').src = data.response.url;
                    document.getElementById('download-btn').href = data.response.url;
                } else if (status === 'failed') {
                    alert("El video no pudo crearse.");
                    location.reload();
                } else {
                    setTimeout(() => checkStatus(id), 4000);
                }
            } catch (e) {
                setTimeout(() => checkStatus(id), 4000);
            }
        }
    </script>
</body>
</html>
