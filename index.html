<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibras Positivas Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-[#1e293b] p-8 rounded-[2rem] shadow-2xl border border-slate-700 text-center">
        <h1 class="text-2xl font-black text-indigo-400 mb-6 italic tracking-tighter uppercase">Vibras Positivas</h1>
        
        <div class="space-y-4">
            <input type="url" id="url-input" placeholder="URL de la App (Ej: La Barbería)" 
                   class="w-full p-4 bg-[#0f172a] border border-slate-700 rounded-2xl outline-none text-sm text-center">
            
            <input type="password" id="api-key" placeholder="Pega tu Sandbox Key" 
                   class="w-full p-4 bg-[#0f172a] border border-slate-700 rounded-2xl outline-none text-sm text-center">
            
            <button onclick="requestVideo()" id="btn-main"
                    class="w-full bg-indigo-600 py-4 rounded-2xl font-black hover:bg-indigo-500 shadow-lg uppercase active:scale-95">
                GENERAR VIDEO 9:16
            </button>
        </div>

        <div id="loader" class="hidden mt-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-900 h-10 w-10 mx-auto mb-4"></div>
            <p id="status-msg" class="text-indigo-400 text-[10px] font-bold animate-pulse">NAVEGANDO EN LA URL...</p>
        </div>

        <div id="result" class="hidden mt-8 p-6 bg-[#0f172a] rounded-[2rem] border border-green-500/20">
            <h3 class="text-green-400 font-bold mb-4 uppercase text-[10px]">¡Video Profesional Listo!</h3>
            <video id="final-video" controls class="w-full rounded-2xl mb-6 shadow-2xl bg-black aspect-[9/16]"></video>
            <a id="download-btn" href="#" download class="block text-center bg-green-600 py-4 rounded-2xl font-bold text-sm">📥 GUARDAR MP4</a>
        </div>
    </div>

    <script>
        async function requestVideo() {
            const urlVal = document.getElementById('url-input').value.trim();
            const apiVal = document.getElementById('api-key').value.trim();
            if(!apiVal || !urlVal) return alert("Falta URL o API KEY");

            document.getElementById('btn-main').disabled = true;
            document.getElementById('loader').classList.remove('hidden');

            try {
                const response = await fetch('https://api.shotstack.io/v1/render', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': apiVal },
                    body: JSON.stringify({
                        timeline: {
                            /* PISTA DE AUDIO */
                            soundtrack: {
                                src: "https://shotstack-assets.s3.amazonaws.com/music/lofi.mp3",
                                effect: "fadeInOut"
                            },
                            tracks: [
                                {
                                    /* CAPA DE LA APP (BROWSER) */
                                    clips: [{
                                        asset: {
                                            type: 'browser',
                                            url: urlVal,
                                            width: 1080, height: 1920
                                        },
                                        start: 0, length: 15
                                    }]
                                }
                            ]
                        },
                        output: { format: 'mp4', resolution: 'sd', aspectRatio: '9:16' }
                    })
                });

                const data = await response.json();
                if (response.ok) checkStatus(data.response.id, apiVal);
                else throw new Error(data.response.message);

            } catch (error) {
                alert("DETALLE: " + error.message);
                location.reload();
            }
        }

        async function checkStatus(id, key) {
            const res = await fetch(`https://api.shotstack.io/v1/render/${id}`, { headers: { 'x-api-key': key } });
            const data = await res.json();
            const status = data.response.status;
            document.getElementById('status-msg').innerText = status.toUpperCase() + "...";

            if (status === 'done') {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('final-video').src = data.response.url;
                document.getElementById('download-btn').href = data.response.url;
            } else if (status === 'failed') {
                alert("Error técnico en Shotstack.");
                location.reload();
            } else {
                setTimeout(() => checkStatus(id, key), 4000);
            }
        }
    </script>
</body>
</html>
