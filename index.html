<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibras Positivas | Video Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700 text-center">
        <h1 class="text-2xl font-bold text-indigo-400 mb-6 italic uppercase tracking-tighter">Vibras Positivas</h1>
        
        <div class="space-y-4">
            <div class="text-left">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">URL de la App</label>
                <input type="url" id="url-input" value="https://haroldco45.github.io/criollitas/" 
                       class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl outline-none text-sm">
            </div>
            
            <div class="text-left">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">API Key (Sandbox)</label>
                <input type="password" id="api-key" placeholder="Pega tu Sandbox Key aquí" 
                       class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl outline-none text-sm text-center">
            </div>
            
            <button onclick="requestVideo()" id="btn-main"
                    class="w-full bg-indigo-600 py-4 rounded-xl font-bold hover:bg-indigo-500 transition-all shadow-lg uppercase tracking-widest">
                GENERAR VIDEO REAL
            </button>
        </div>

        <div id="loader" class="hidden mt-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-12 w-12 mx-auto mb-4"></div>
            <p id="status-msg" class="text-indigo-400 text-sm animate-pulse font-bold">CONECTANDO...</p>
        </div>

        <div id="result" class="hidden mt-8 p-6 bg-slate-900 rounded-2xl border border-green-500/30 shadow-inner">
            <h3 class="text-green-400 font-bold mb-4 uppercase text-xs tracking-widest">¡Video Listo para Descargar!</h3>
            <video id="final-video" controls class="w-full rounded-xl mb-6 shadow-2xl border border-slate-700"></video>
            <a id="download-btn" href="#" download="vibras_positivas.mp4" 
               class="block text-center bg-green-600 py-4 rounded-xl font-bold text-sm hover:bg-green-500 transition-all shadow-lg">
                📥 GUARDAR MP4
            </a>
        </div>
    </div>

    <script>
        async function requestVideo() {
            const urlInput = document.getElementById('url-input').value;
            const apiKey = document.getElementById('api-key').value.trim();
            const btn = document.getElementById('btn-main');
            const loader = document.getElementById('loader');
            const statusMsg = document.getElementById('status-msg');

            if(!apiKey) return alert("Por favor, pega tu Sandbox Key");

            btn.disabled = true;
            loader.classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');

            try {
                const response = await fetch('https://api.shotstack.io/v1/render', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                    body: JSON.stringify({
                        timeline: {
                            tracks: [{
                                clips: [{
                                    asset: {
                                        type: 'html',
                                        html: `<iframe src="${urlInput}" width="1024" height="576" style="border:none;"></iframe>`,
                                        width: 1024, height: 576
                                    },
                                    start: 0, length: 15
                                }]
                            }]
                        },
                        output: { format: 'mp4', resolution: 'sd' }
                    })
                });

                const data = await response.json();

                // Lógica simplificada: Si no hay ID, hay error
                if (data && data.response && data.response.id) {
                    statusMsg.innerText = "GRABANDO APP...";
                    checkStatus(data.response.id, apiKey);
                } else {
                    const errorTxt = data?.response?.message || "Error en la Key o la URL";
                    throw new Error(errorTxt);
                }

            } catch (error) {
                alert("AVISO: " + error.message);
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }

        async function checkStatus(id, key) {
            try {
                const res = await fetch(`https://api.shotstack.io/v1/render/${id}`, {
                    headers: { 'x-api-key': key }
                });
                const data = await res.json();
                const status = data?.response?.status;

                if (status) document.getElementById('status-msg').innerText = "ESTADO: " + status.toUpperCase();

                if (status === 'done') {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('final-video').src = data.response.url;
                    document.getElementById('download-btn').href = data.response.url;
                    document.getElementById('btn-main').disabled = false;
                } else if (status === 'failed') {
                    alert("El servidor no pudo crear el video.");
                    location.reload();
                } else {
                    setTimeout(() => checkStatus(id, key), 4000);
                }
            } catch (e) {
                setTimeout(() => checkStatus(id, key), 4000);
            }
        }
    </script>
</body>
</html>
