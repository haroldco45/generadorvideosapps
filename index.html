<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibras Positivas | Studio v6</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-zinc-900 p-8 rounded-[2.5rem] border border-zinc-800 text-center shadow-2xl">
        <h1 class="text-xl font-black text-indigo-500 mb-8 tracking-tighter uppercase italic">Vibras Positivas Studio</h1>
        
        <div class="space-y-6">
            <div class="text-left">
                <label class="text-[10px] font-bold text-zinc-500 uppercase ml-2 mb-1 block">URL de la App (Empresa)</label>
                <input type="url" id="url-input" value="https://haroldco45.github.io/criollitas/" 
                       class="w-full p-4 bg-black border border-zinc-700 rounded-2xl outline-none text-sm text-center focus:border-indigo-500 transition-all">
            </div>
            
            <div class="text-left">
                <label class="text-[10px] font-bold text-zinc-500 uppercase ml-2 mb-1 block">Tu Sandbox Key</label>
                <input type="password" id="api-key" value="CA9aKlz40Ca3D8thAwzEh7jS6znYkUOOFVJPp1TA" 
                       class="w-full p-4 bg-black border border-zinc-700 rounded-2xl outline-none text-[10px] text-center tracking-[0.2em] opacity-60">
            </div>
            
            <button onclick="requestVideo()" id="btn-main"
                    class="w-full bg-indigo-600 py-5 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-indigo-500 active:scale-95 transition-all shadow-lg shadow-indigo-500/20">
                GENERAR VIDEO AHORA
            </button>
        </div>

        <div id="loader" class="hidden mt-10">
            <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p id="status-msg" class="text-indigo-400 text-[10px] font-bold tracking-widest animate-pulse uppercase">Conectando al motor...</p>
        </div>

        <div id="result" class="hidden mt-10 p-4 bg-black rounded-3xl border border-green-500/30">
            <h3 class="text-green-500 text-[10px] font-bold mb-4 uppercase tracking-widest italic">¡Video Generado con Éxito!</h3>
            <video id="final-video" controls class="w-full rounded-2xl mb-4 bg-zinc-800 aspect-[9/16] shadow-2xl"></video>
            <a id="download-btn" href="#" download="vibras_positivas.mp4" class="block text-center bg-green-600 py-4 rounded-xl font-black text-xs uppercase tracking-widest">📥 GUARDAR MP4</a>
        </div>
    </div>

    <script>
        async function requestVideo() {
            const url = document.getElementById('url-input').value.trim();
            const key = document.getElementById('api-key').value.trim();
            
            document.getElementById('btn-main').style.display = 'none';
            document.getElementById('loader').classList.remove('hidden');

            try {
                // VOLVEMOS AL ENDPOINT V1 PERO CON CONFIGURACIÓN DE SEGURIDAD
                const response = await fetch('https://api.shotstack.io/v1/render', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'x-api-key': key 
                    },
                    body: JSON.stringify({
                        timeline: {
                            tracks: [{
                                clips: [{
                                    asset: { 
                                        type: 'html', 
                                        html: `<iframe src="${url}" width="1080" height="1920" style="border:none;"></iframe>`,
                                        width: 1080, height: 1920
                                    },
                                    start: 0, length: 10 // DURACIÓN CORTA PARA PRUEBA RÁPIDA
                                }]
                            }]
                        },
                        output: { format: 'mp4', resolution: 'sd', aspectRatio: '9:16' }
                    })
                });

                const data = await response.json();
                
                if(data && data.response && data.response.id) {
                    checkStatus(data.response.id, key);
                } else {
                    const msg = data.response ? data.response.message : "Error de comunicación";
                    throw new Error(msg);
                }

            } catch (e) {
                alert("DETALLE: " + e.message);
                location.reload();
            }
        }

        async function checkStatus(id, key) {
            try {
                const res = await fetch('https://api.shotstack.io/v1/render/' + id, { headers: { 'x-api-key': key } });
                const data = await res.json();
                const status = (data && data.response) ? data.response.status : 'queued';
                
                document.getElementById('status-msg').innerText = status.toUpperCase() + "...";

                if(status === 'done') {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('final-video').src = data.response.url;
                    document.getElementById('download-btn').href = data.response.url;
                } else if(status === 'failed') {
                    alert("El servidor falló. Revisa tu URL.");
                    location.reload();
                } else {
                    setTimeout(() => checkStatus(id, key), 4000);
                }
            } catch (e) {
                setTimeout(() => checkStatus(id, key), 4000);
            }
        }
    </script>
</body>
</html>
